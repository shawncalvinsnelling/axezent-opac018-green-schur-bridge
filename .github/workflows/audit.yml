name: Axezent Proof-Audit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile source
        run: |
          python -m compileall -q .

      - name: Run exact audit
        run: |
          python pure_python_exact_audit.py

      - name: Run stress test
        run: |
          python counterexample_stress_test.py

      - name: Run verifier
        run: |
          python verify_all.py

      - name: Run tests
        run: |
          python -m pytest tests/ -q

      - name: Verify release manifest
        run: |
          python verify_manifest.py

      - name: Check SHA-256 manifest
        run: |
          python build_sha_manifest.py --check
