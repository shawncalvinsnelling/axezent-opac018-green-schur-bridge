name: Axezent Proof-Audit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Run exact pure Python audit
        run: |
          python pure_python_exact_audit.py

      - name: Run counterexample stress test
        run: |
          python counterexample_stress_test.py

      - name: Run global verifier
        run: |
          python verify_all.py

      - name: Run pytest suite
        run: |
          pytest tests/ -q

      - name: Verify release manifest
        run: |
          python verify_manifest.py

      - name: Check SHA-256 manifest
        run: |
          python build_sha_manifest.py --check
