name: Axezent Manifest Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate SHA-256 manifest
        run: |
          python build_sha_manifest.py

      - name: Verify regenerated manifest
        run: |
          python verify_manifest.py

      - name: Commit refreshed manifest receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add receipts/SHA256SUMS.txt receipts/manifest_verification_results.json

          if git diff --cached --quiet; then
            echo "No manifest receipt changes to commit."
          else
            git commit -m "receipts: refresh manifest integrity receipts"
            git push
          fi
