name: OPAC-016 Lean Arithmetic Kernel

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'opac016/formal/**'
      - '.github/workflows/opac016-formal.yml'
  push:
    branches: [ main ]
    paths:
      - 'opac016/formal/**'
      - '.github/workflows/opac016-formal.yml'
  workflow_dispatch:

jobs:
  lean-arithmetic-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan / pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve Mathlib dependencies
        working-directory: opac016/formal
        run: |
          "$HOME/.elan/bin/lake" update
          "$HOME/.elan/bin/lake" exe cache get

      - name: Reject placeholders and project axioms
        working-directory: opac016/formal
        run: |
          if grep -RInE '\bsorry\b|\baxiom\b' --include='*.lean' .; then
            echo 'Lean placeholders/project axioms are not allowed in this kernel.'
            exit 1
          fi

      - name: Build partial formal arithmetic kernel
        working-directory: opac016/formal
        run: "$HOME/.elan/bin/lake build"
